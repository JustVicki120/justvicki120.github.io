<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Photography | JustVicki</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#172238;color:#f5f0e8;font-family:Georgia,serif}
header{text-align:center;padding:65px 20px 35px;background:#172238}h1{font-size:clamp(38px,5vw,64px);font-weight:normal;margin:0;letter-spacing:2px}.subtitle{font-style:italic;color:#c4cad6;margin-top:15px;font-size:17px}
.photo-section{width:100%;padding:65px 30px;text-align:center;background:linear-gradient(to bottom,var(--section-start) 0%,var(--section-start) 74%,var(--section-end) 100%)}
.photo-section figure{max-width:1100px;margin:0 auto}.photo-section figure.align-left{max-width:880px;margin-left:max(0px,7%);margin-right:auto}.photo-section figure.align-right{max-width:880px;margin-left:auto;margin-right:max(0px,7%)}
.photo-section:nth-of-type(3n) figure{max-width:780px}.photo-section img{display:block;width:100%;height:auto;border-radius:3px;cursor:zoom-in;box-shadow:0 12px 35px rgba(0,0,0,.28);transition:transform .3s ease}.photo-section img:hover{transform:scale(1.012)}figcaption{margin-top:20px;font-size:16px;line-height:1.6;color:#f8f5ef}
footer{text-align:center;padding:60px 20px;background:#172238}.back{color:#fff;text-decoration:none;font-size:17px}.back:hover{text-decoration:underline}
.lightbox{display:none;position:fixed;inset:0;background:rgba(5,9,18,.96);z-index:1000;justify-content:center;align-items:center;padding:45px;cursor:zoom-out}.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:90vh;object-fit:contain}.close{position:absolute;top:15px;right:25px;font-size:38px;color:white;cursor:pointer}
@media(max-width:700px){header{padding:45px 15px 20px}.photo-section{padding:45px 20px}.photo-section figure,.photo-section figure.align-left,.photo-section figure.align-right{max-width:100%;margin:0 auto}.lightbox{padding:15px}}
</style></head><body><header><h1>Photography</h1><p class="subtitle">A few moments through my eyes</p></header><main>

</main><footer><a class="back" href="index.html">← Back to JustVicki</a></footer>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged photograph"><span class="close" id="close">&times;</span><img id="lightboxImage" alt=""></div>
<script>
const lightbox=document.getElementById('lightbox'),lightboxImage=document.getElementById('lightboxImage');
document.querySelectorAll('.photo-section img').forEach(img=>img.addEventListener('click',()=>{lightboxImage.src=img.src;lightboxImage.alt=img.alt;lightbox.classList.add('open')}));
function closeLightbox(){lightbox.classList.remove('open');lightboxImage.src=''}
lightbox.addEventListener('click',closeLightbox);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()});
</script></body></html>
