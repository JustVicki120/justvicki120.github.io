<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography | JustVicki</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #172238;
      color: #f5f0e8;
      font-family: Georgia, serif;
    }

    header {
      text-align: center;
      padding: 65px 20px 35px;
    }

    h1 {
      font-size: clamp(38px, 5vw, 64px);
      font-weight: normal;
      margin: 0;
      letter-spacing: 2px;
    }

    .subtitle {
      font-style: italic;
      color: #c4cad6;
      margin-top: 15px;
      font-size: 17px;
    }

    .gallery {
      max-width: 1250px;
      margin: 0 auto;
      padding: 30px 35px 100px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 65px 35px;
      align-items: center;
    }

    figure {
      margin: 0;
      text-align: center;
    }

    figure img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 3px;
      cursor: zoom-in;
      box-shadow: 0 12px 35px rgba(0,0,0,.35);
      transition: transform .3s ease;
    }

    figure img:hover {
      transform: scale(1.015);
    }

    figcaption {
      margin-top: 17px;
      color: #d8dce5;
      font-size: 15px;
      line-height: 1.6;
    }

    .storm {
      grid-column: 1 / 13;
    }

    .plantation {
      grid-column: 2 / 12;
    }

    .pippin {
      grid-column: 1 / 7;
    }

    .tuki {
      grid-column: 8 / 13;
    }

    .back {
      display: block;
      text-align: center;
      padding: 25px;
      color: #f5f0e8;
      text-decoration: none;
      font-size: 16px;
    }

    .back:hover {
      text-decoration: underline;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5,9,18,.96);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 45px;
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
    }

    .close {
      position: absolute;
      top: 15px;
      right: 25px;
      font-size: 38px;
      color: white;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      header {
        padding: 45px 15px 20px;
      }

      .gallery {
        display: block;
        padding: 25px 20px 60px;
      }

      figure {
        margin-bottom: 45px;
      }

      .lightbox {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Photography</h1>
  <p class="subtitle">A few moments through my eyes</p>
</header>

<main class="gallery">

  <figure class="storm">
    <img src="photography/IMG_0336.JPG"
         alt="Dramatic storm clouds over a winding road in Colorado">
    <figcaption>Colorado Storm</figcaption>
  </figure>

  <figure class="plantation">
    <img src="photography/IMG_0491.jpeg"
         alt="Interior of the former slave quarters at Laura Plantation">
    <figcaption>
      Laura Plantation — Louisiana
    </figcaption>
  </figure>

  <figure class="pippin">
    <img src="photography/IMG_0327.JPG"
         alt="Pippin the green-cheek conure exploring a food jar">
    <figcaption>Pippin — My Heart Bird ❤️</figcaption>
  </figure>

  <figure class="tuki">
    <img src="photography/IMG_3911.JPG"
         alt="Tuki the parrot playing with hemostats">
    <figcaption>Tuki — Ruler of the Roost</figcaption>
  </figure>

</main>

<a class="back" href="index.html">← Back to JustVicki</a>

<div class="lightbox" id="lightbox"
     role="dialog"
     aria-modal="true"
     aria-label="Enlarged photograph">
  <span class="close" id="close">&times;</span>
  <img id="lightboxImage" alt="">
</div>

<script>
  const lightbox = document.getElementById("lightbox");
  const lightboxImage = document.getElementById("lightboxImage");

  document.querySelectorAll(".gallery img").forEach(img => {
    img.addEventListener("click", () => {
      lightboxImage.src = img.src;
      lightboxImage.alt = img.alt;
      lightbox.classList.add("open");
    });
  });

  function closeLightbox() {
    lightbox.classList.remove("open");
    lightboxImage.src = "";
  }

  lightbox.addEventListener("click", closeLightbox);

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeLightbox();
  });
</script>

</body>
</html>
