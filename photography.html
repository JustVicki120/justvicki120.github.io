<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photography | JustVicki</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #172238;
  color: #f5f0e8;
  font-family: Georgia, serif;
}

/* PAGE HEADER */

header {
  text-align: center;
  padding: 65px 20px 35px;
  background: #172238;
}

h1 {
  font-size: clamp(38px, 5vw, 64px);
  font-weight: normal;
  margin: 0;
  letter-spacing: 2px;
}

.subtitle {
  font-style: italic;
  color: #c4cad6;
  margin-top: 15px;
  font-size: 17px;
}

/* PHOTOGRAPHY SECTIONS */

.photo-section {
  width: 100%;
  padding: 65px 30px;
  text-align: center;
}

.photo-section figure {
  margin: 0 auto;
}

.photo-section img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 3px;
  cursor: zoom-in;
  box-shadow: 0 12px 35px rgba(0,0,0,.28);
  transition: transform .3s ease;
}

.photo-section img:hover {
  transform: scale(1.012);
}

figcaption {
  margin-top: 20px;
  font-size: 16px;
  line-height: 1.6;
  color: #f8f5ef;
}

/* COLOR TRANSITIONS */

.storm-section {
  background: linear-gradient(
    to bottom,
    #172238 0%,
    #172238 75%,
    #92765D 100%
  );
}

.plantation-section {
  background: linear-gradient(
    to bottom,
    #92765D 0%,
    #92765D 75%,
    #667B91 100%
  );
}

.pippin-section {
  background: linear-gradient(
    to bottom,
    #667B91 0%,
    #667B91 75%,
    #85817D 100%
  );
}

.tuki-section {
  background: #85817D;
}

/* ASYMMETRICAL PHOTO SIZES */

.storm-section figure {
  max-width: 1150px;
}

.plantation-section figure {
  max-width: 950px;
  margin-left: 12%;
}

.pippin-section figure {
  max-width: 620px;
  margin-left: 8%;
}

.tuki-section figure {
  max-width: 570px;
  margin-right: 8%;
}

/* FOOTER */

footer {
  text-align: center;
  padding: 60px 20px;
  background: #85817D;
}

.back {
  color: #fff;
  text-decoration: none;
  font-size: 17px;
}

.back:hover {
  text-decoration: underline;
}

/* FULL-SCREEN PHOTO VIEWER */

.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(5,9,18,.96);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  padding: 45px;
  cursor: zoom-out;
}

.lightbox.open {
  display: flex;
}

.lightbox img {
  max-width: 100%;
  max-height: 90vh;
  object-fit: contain;
}

.close {
  position: absolute;
  top: 15px;
  right: 25px;
  font-size: 38px;
  color: white;
  cursor: pointer;
}

/* MOBILE */

@media (max-width: 700px) {
  header {
    padding: 45px 15px 20px;
  }

  .photo-section {
    padding: 45px 20px;
  }

  .photo-section figure {
    max-width: 100%;
    margin: 0 auto;
  }

  .lightbox {
    padding: 15px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Photography</h1>
  <p class="subtitle">A few moments through my eyes</p>
</header>

<main>

<section class="photo-section storm-section">
  <figure>
    <img src="photography/IMG_0336.JPG"
         alt="Dramatic storm clouds over a winding road in Colorado">
    <figcaption>Colorado Storm</figcaption>
  </figure>
</section>

<section class="photo-section plantation-section">
  <figure>
    <img src="photography/IMG_0491.jpeg"
         alt="Interior of the former slave quarters at Laura Plantation">
    <figcaption>Laura Plantation — Louisiana</figcaption>
  </figure>
</section>

<section class="photo-section pippin-section">
  <figure>
    <img src="photography/IMG_0327.JPG"
         alt="Pippin the green-cheek conure exploring a food jar">
    <figcaption>Pippin — My Heart Bird ❤️</figcaption>
  </figure>
</section>

<section class="photo-section tuki-section">
  <figure>
    <img src="photography/IMG_3911.JPG"
         alt="Tuki the parrot playing with hemostats">
    <figcaption>Tuki — Ruler of the Roost</figcaption>
  </figure>
</section>

</main>

<footer>
  <a class="back" href="index.html">← Back to JustVicki</a>
</footer>

<div class="lightbox" id="lightbox"
     role="dialog"
     aria-modal="true"
     aria-label="Enlarged photograph">
  <span class="close" id="close">&times;</span>
  <img id="lightboxImage" alt="">
</div>

<script>
const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");

document.querySelectorAll(".photo-section img").forEach(img => {
  img.addEventListener("click", () => {
    lightboxImage.src = img.src;
    lightboxImage.alt = img.alt;
    lightbox.classList.add("open");
  });
});

function closeLightbox() {
  lightbox.classList.remove("open");
  lightboxImage.src = "";
}

lightbox.addEventListener("click", closeLightbox);

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeLightbox();
});
</script>

</body>
</html>
